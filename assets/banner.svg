<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="aaPanel MCP Server — manage your aaPanel server with Claude">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#132a3e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#20a53a"/>
      <stop offset="1" stop-color="#d97757"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.04"/>
    </pattern>
  </defs>
  <rect width="1280" height="400" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="400" rx="24" fill="url(#grid)"/>

  <!-- Claude -->
  <g transform="translate(150 200)">
    <circle r="62" fill="#d97757" fill-opacity="0.14" stroke="#d97757" stroke-width="2"/>
    <g fill="#d97757">
      <rect x="-5" y="-38" width="10" height="76" rx="5"/>
      <rect x="-5" y="-38" width="10" height="76" rx="5" transform="rotate(60)"/>
      <rect x="-5" y="-38" width="10" height="76" rx="5" transform="rotate(120)"/>
    </g>
    <text y="96" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#cbd5e1">Claude</text>
  </g>

  <!-- link -->
  <g stroke="#64748b" stroke-width="3" stroke-dasharray="8 8" stroke-linecap="round" fill="none">
    <path d="M232 200 H318"/>
    <path d="M962 200 H1048"/>
  </g>
  <text x="275" y="186" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="13" fill="#94a3b8">MCP</text>
  <text x="1005" y="186" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="13" fill="#94a3b8">API</text>

  <!-- title -->
  <text x="640" y="150" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="#f8fafc">aaPanel MCP Server</text>
  <text x="640" y="198" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#cbd5e1">Manage your aaPanel server by chatting with Claude</text>
  <g font-family="Consolas, Menlo, monospace" font-size="16" fill="#e2e8f0">
    <g transform="translate(355 238)"><rect width="110" height="36" rx="18" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.12"/><text x="55" y="23" text-anchor="middle">Websites</text></g>
    <g transform="translate(477 238)"><rect width="80" height="36" rx="18" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.12"/><text x="40" y="23" text-anchor="middle">Files</text></g>
    <g transform="translate(569 238)"><rect width="84" height="36" rx="18" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.12"/><text x="42" y="23" text-anchor="middle">MySQL</text></g>
    <g transform="translate(665 238)"><rect width="74" height="36" rx="18" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.12"/><text x="37" y="23" text-anchor="middle">Cron</text></g>
    <g transform="translate(751 238)"><rect width="104" height="36" rx="18" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.12"/><text x="52" y="23" text-anchor="middle">Firewall</text></g>
    <g transform="translate(867 238)"><rect width="78" height="36" rx="18" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.12"/><text x="39" y="23" text-anchor="middle">Shell</text></g>
  </g>
  <text x="640" y="322" text-anchor="middle" font-family="Consolas, Menlo, monospace" font-size="15" fill="#64748b">51 tools · read-only by default · open source (MIT)</text>

  <!-- server -->
  <g transform="translate(1130 200)">
    <circle r="62" fill="#20a53a" fill-opacity="0.14" stroke="#20a53a" stroke-width="2"/>
    <g fill="none" stroke="#20a53a" stroke-width="4">
      <rect x="-30" y="-30" width="60" height="22" rx="5"/>
      <rect x="-30" y="2" width="60" height="22" rx="5"/>
    </g>
    <circle cx="-18" cy="-19" r="3.5" fill="#20a53a"/>
    <circle cx="-18" cy="13" r="3.5" fill="#20a53a"/>
    <text y="96" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="18" fill="#cbd5e1">aaPanel</text>
  </g>
</svg>
